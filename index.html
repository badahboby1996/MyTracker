<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5568">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ХЪСЪЛ">
<meta name="description" content="180 дни в действие. Личният контент календар на Боби за септември 2026 — сценарии, публикации и резултати.">
<title>ХЪСЪЛ • Твоите 180 дни</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
/* ============================================================
   ХЪСЪЛ — дизайн система
   1. Токени  2. Основа  3. Фон  4. Типография  5. Оформление
   6. Навигация  7. Бутони  8. Повърхности  9. Етикети
   10. Публикации  11. Числа  12. Задачи  13. Съобщения
   14. Календар  15. Таблици  16. Формуляри  17. Текстови блокове
   18. Диалог  19. Toast  20. Адаптивност  21. Печат
   ============================================================ */

/* --- 1. Токени ------------------------------------------- */
:root{
  color-scheme:dark;

  /* Основа */
  --bg:#0c212b;
  --dark:#0c212b;

  /* Мастило */
  --ink:#f4f9fc;
  --ink-2:#bfd4e1;
  --ink-3:#9db6c4;
  --muted:var(--ink-2);

  /* Акцент */
  --peach:#f7c9a7;
  --peach-soft:rgba(247,201,167,.16);
  --peach-line:rgba(247,201,167,.42);
  --peach-ink:#0f2a35;
  --good:#a9dd9c;
  --alert:#f5a3a3;

  /* Повърхности */
  --line:rgba(255,255,255,.14);
  --line-strong:rgba(255,255,255,.24);
  --card:linear-gradient(155deg,rgba(255,255,255,.115),rgba(255,255,255,.045));
  --surface-2:linear-gradient(155deg,rgba(226,241,251,.26),rgba(150,190,216,.10));
  --surface-warm:linear-gradient(155deg,rgba(247,201,167,.22),rgba(247,201,167,.05));
  --inset:rgba(4,18,26,.4);

  /* Радиуси */
  --radius:24px;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:11px;
  --r-pill:999px;

  /* Сенки */
  --shadow:0 20px 44px -22px rgba(0,0,0,.75);
  --shadow-lg:0 34px 80px -28px rgba(0,0,0,.8);
  --edge:inset 0 1px 0 rgba(255,255,255,.16);

  /* Ритъм */
  --gap:16px;
  --pad:24px;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;
  font-weight:400;
}

/* --- 2. Основа ------------------------------------------- */
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  line-height:1.55;
  min-width:280px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.35;cursor:default}
a{color:var(--peach);text-underline-offset:4px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
button,input,select,textarea{border-radius:var(--r-sm)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{
  outline:2px solid var(--peach);outline-offset:3px;border-radius:var(--r-sm)
}
input:focus,select:focus,textarea:focus{outline:none}
::selection{background:var(--peach);color:var(--peach-ink)}

/* --- 3. Фон ---------------------------------------------- */
body:before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60% 42% at 82% -6%,rgba(247,201,167,.30),transparent 68%),
    radial-gradient(58% 46% at -8% 16%,rgba(126,186,224,.26),transparent 70%),
    radial-gradient(70% 50% at 50% 108%,rgba(9,26,35,.85),transparent 70%),
    linear-gradient(168deg,#2b5568 0%,#1a3f50 38%,#102b37 72%,#0a1d26 100%);
}
/* Мека мрежа за дълбочина под стъклените карти */
body:after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 30% at 15% 88%,rgba(150,120,200,.12),transparent 70%),
    radial-gradient(35% 28% at 92% 62%,rgba(247,201,167,.10),transparent 72%);
}

/* --- 4. Типография --------------------------------------- */
h1,h2,h3,p{margin:0}
h1{
  font-size:clamp(2rem,5.2vw,2.9rem);line-height:1.08;
  font-weight:700;letter-spacing:-.035em;
}
h2{font-size:1.35rem;line-height:1.28;font-weight:650;letter-spacing:-.02em}
h3{font-size:1.0625rem;line-height:1.4;font-weight:650;letter-spacing:-.01em}
small,.small{font-size:.875rem;line-height:1.5}
.muted{color:var(--ink-2)}
.eyebrow{
  text-transform:uppercase;font-size:.6875rem;letter-spacing:.16em;
  font-weight:700;color:var(--ink-3)
}
.good{color:var(--good)}
.warn{color:var(--peach)}
.statnum,.value,.beattime,.datebadge b,.rating b,.day,td,.metricrow .value{
  font-variant-numeric:tabular-nums
}
.icon{
  width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle
}
.icon.sm{width:17px;height:17px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0
}

/* --- 5. Оформление --------------------------------------- */
.shell{
  max-width:1240px;margin:auto;
  padding:calc(24px + env(safe-area-inset-top)) 32px calc(40px + env(safe-area-inset-bottom))
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:28px
}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.brandmark{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  font-size:19px;font-weight:700;line-height:1;letter-spacing:-.08em;padding-right:1px;
  background:linear-gradient(150deg,rgba(247,201,167,.9),rgba(247,201,167,.45));
  color:var(--peach-ink);
  box-shadow:0 8px 22px -10px rgba(247,201,167,.8)
}
.brand strong{font-size:.9375rem;letter-spacing:.2em;font-weight:700}
.topmeta{display:flex;gap:12px;align-items:center}
.avatar{
  width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);
  border:1px solid var(--line-strong);display:grid;place-items:center;
  font-size:.8125rem;font-weight:650;letter-spacing:.02em
}
.layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:40px}
.page{min-width:0;animation:arrive .24s ease}
.pagehead{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  margin-bottom:26px
}
.pagehead .eyebrow{margin-bottom:10px}
.pagehead h1+p,.pagehead p+p{margin-top:10px;max-width:56ch}
.sectiontitle{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:32px 0 14px
}
.sectiontitle:first-child{margin-top:0}
.stack{display:grid;gap:var(--gap)}
.twocol{
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
  gap:var(--gap);align-items:start
}
.divider{height:1px;background:var(--line);margin:22px 0;border:0}
/* Списъкът с всички публикации е решетка от карти, не две колони */
section>.twocol{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:stretch}
@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* --- 6. Навигация ---------------------------------------- */
.nav{align-self:start;position:sticky;top:28px;display:flex;flex-direction:column;gap:4px}
.nav button{
  position:relative;background:transparent;border:1px solid transparent;
  padding:13px 16px;display:flex;gap:13px;align-items:center;text-align:left;
  color:var(--ink-2);font-size:.9375rem;font-weight:550;min-height:50px;
  border-radius:var(--r-md);transition:background .18s ease,color .18s ease
}
.nav button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.nav button.active{
  background:rgba(255,255,255,.13);color:#fff;border-color:var(--line-strong);
  box-shadow:var(--shadow),var(--edge)
}
.nav button.active:before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--peach)
}
.nav button.active svg{stroke:var(--peach)}
.navfooter{border-top:1px solid var(--line);margin:28px 8px 0;padding-top:20px}
.navfooter p{margin-top:8px;font-size:.875rem;color:var(--ink-2);line-height:1.75}

/* --- 7. Бутони ------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:rgba(255,255,255,.09);border:1px solid var(--line-strong);
  padding:11px 18px;min-height:46px;border-radius:var(--r-pill);
  text-decoration:none;color:var(--ink);font-size:.9375rem;font-weight:550;
  line-height:1.35;transition:background .16s ease,transform .16s ease,border-color .16s ease
}
.btn:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.34)}
.btn:active{transform:scale(.98)}
.btn.primary,.btn.peach{
  background:linear-gradient(170deg,#ffd9bd,var(--peach));
  color:var(--peach-ink);border-color:transparent;font-weight:700;
  box-shadow:0 14px 30px -14px rgba(247,201,167,.85)
}
.btn.primary:hover,.btn.peach:hover{
  background:linear-gradient(170deg,#ffe3cc,#ffd0af);border-color:transparent
}
.btn.full{width:100%}
.btn.iconbtn{width:46px;padding:0;flex:none;border-radius:50%}
.btn.small{padding:8px 15px;font-size:.875rem;min-height:40px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.plainlink{
  background:none;border:0;color:var(--ink);padding:0;text-align:left;
  text-decoration:underline;text-decoration-color:var(--peach-line);
  text-underline-offset:3px;font-weight:550
}
.plainlink:hover{text-decoration-color:var(--peach)}

/* --- 8. Повърхности -------------------------------------- */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--pad);
  box-shadow:var(--shadow),var(--edge);
  min-width:0;
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%)
}
.card.light{background:var(--surface-2);border-color:rgba(255,255,255,.28)}
.card.light .eyebrow{color:rgba(255,255,255,.72)}
.card.light .muted,.card.light .small.muted{color:rgba(255,255,255,.82)}
.card.light .tag{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.card.warm{background:var(--surface-warm);border-color:var(--peach-line)}
.card.warm .eyebrow{color:var(--peach)}
.card p+p{margin-top:12px}
.card .sectiontitle:first-child{margin-top:0}

/* --- 9. Етикети ------------------------------------------ */
.tag{
  display:inline-flex;align-items:center;gap:7px;font-size:.75rem;font-weight:600;
  line-height:1.3;background:rgba(255,255,255,.09);padding:6px 12px;
  border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-2);
  white-space:nowrap
}
.pillartag{color:var(--pcolor);border-color:rgba(255,255,255,.2)}
@supports(background:color-mix(in srgb,red,blue)){
  .pillartag{
    background:color-mix(in srgb,var(--pcolor) 18%,transparent);
    border-color:color-mix(in srgb,var(--pcolor) 45%,transparent)
  }
}
.dot{
  width:7px;height:7px;border-radius:50%;background:currentColor;
  display:inline-block;flex:none;box-shadow:0 0 8px currentColor
}
.chip{
  border:1px solid var(--line-strong);background:rgba(255,255,255,.05);
  padding:9px 16px;border-radius:var(--r-pill);min-height:42px;
  font-size:.875rem;font-weight:600;color:var(--ink-2);
  transition:background .16s ease,color .16s ease
}
.chip:hover{background:rgba(255,255,255,.13);color:var(--ink)}
.chip.active{
  background:#eaf3f9;border-color:#eaf3f9;color:var(--peach-ink);
  box-shadow:0 10px 24px -14px rgba(0,0,0,.9)
}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.snapbadge{
  font-size:.6875rem;font-weight:700;letter-spacing:.05em;border-radius:var(--r-sm);
  padding:4px 8px;background:rgba(255,255,255,.1);border:1px solid var(--line)
}
.datebadge{
  background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:var(--r-md);padding:10px 15px;text-align:center;
  font-size:.8125rem;color:var(--ink-2);white-space:nowrap
}
.datebadge b{display:block;font-size:1.5rem;font-weight:650;color:var(--ink);letter-spacing:-.02em}

/* --- 10. Публикации -------------------------------------- */
.postcard{
  position:relative;overflow:hidden;padding:0;
  display:flex;flex-direction:column;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease
}
.postcard:before{
  content:"";width:4px;position:absolute;inset:0 auto 0 0;
  background:linear-gradient(180deg,var(--pcolor),color-mix(in srgb,var(--pcolor) 25%,transparent));
  background:var(--pcolor)
}
.postcard:hover{
  transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--shadow-lg),var(--edge)
}
.postmain{
  background:none;border:0;border-radius:0;text-align:left;width:100%;
  padding:22px 24px 16px;display:block;flex:1
}
.postmain:hover{background:rgba(255,255,255,.05)}
.postmain h3{margin:12px 0 6px;font-size:1.1875rem;line-height:1.3}
.posttop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.posthook{color:var(--ink);margin-top:14px;font-size:.9375rem;line-height:1.55;opacity:.92}
.postdate{font-size:.8125rem;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.postfooter{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 22px 18px;margin:auto 2px 0;font-size:.8125rem;font-weight:600;
  color:var(--ink-2);border-top:1px solid var(--line)
}
.postfooter>span svg{stroke:var(--good)}

/* Открояваща публикация */
.featured h2{font-size:clamp(1.7rem,3.1vw,2.15rem);line-height:1.15;margin:16px 0 14px;letter-spacing:-.03em}
.featured .hookquote{
  font-size:1.0625rem;line-height:1.55;max-width:46ch;color:var(--ink);
  border-left:3px solid var(--peach);padding-left:16px;margin-bottom:18px
}
.featured .actions{margin-top:22px}

/* --- 11. Числа ------------------------------------------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.statnum{
  font-size:clamp(2.2rem,6vw,2.6rem);line-height:1.08;letter-spacing:-.045em;
  font-weight:650;margin:10px 0 6px
}
.progress{
  height:7px;border-radius:var(--r-pill);background:rgba(0,0,0,.3);
  overflow:hidden;margin-top:16px;border:1px solid rgba(255,255,255,.08)
}
.progress span{
  display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,#ffd9bd,var(--peach));
  box-shadow:0 0 14px rgba(247,201,167,.6)
}
.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rating>div{
  padding:16px;border:1px solid var(--line);border-radius:var(--r-md);
  background:rgba(255,255,255,.05)
}
.rating b{display:block;font-size:1.5rem;font-weight:650;letter-spacing:-.02em;margin-bottom:2px}
.barline{display:flex;justify-content:space-between;font-size:.875rem;gap:10px}
.viewgoal{margin-top:16px}

/* --- 12. Задачи ------------------------------------------ */
.task{
  display:flex;gap:14px;align-items:flex-start;padding:16px 0;
  border-bottom:1px solid var(--line)
}
.task:last-child{border-bottom:0;padding-bottom:0}
.task:first-child{padding-top:0}
.check{
  appearance:none;-webkit-appearance:none;position:relative;flex:none;
  width:24px;height:24px;margin:2px 0 0;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.4);background:rgba(4,18,26,.35);
  cursor:pointer;transition:background .16s ease,border-color .16s ease
}
.check:hover{border-color:var(--peach)}
.check:checked{background:var(--peach);border-color:var(--peach)}
.check:checked:after{
  content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;
  border:solid var(--peach-ink);border-width:0 2.5px 2.5px 0;transform:rotate(43deg)
}
.taskbody{flex:1;min-width:0}
.taskbody p{margin-top:6px;font-size:.875rem;color:var(--ink-2)}
.tasktime{
  font-size:.6875rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:3px
}
.tasktitle{font-size:1rem;font-weight:650;line-height:1.4}
.task.done .tasktitle{text-decoration:line-through;opacity:.55}
.task details{border:0;padding:10px 0 0}
.task summary{font-size:.8125rem;font-weight:650;color:var(--peach);margin-left:16px}
.task details[open]>summary{margin-bottom:10px}
.task details p{font-size:.875rem}

/* --- 13. Съобщения --------------------------------------- */
.notice{
  position:relative;padding:15px 18px 15px 20px;border:1px solid var(--peach-line);
  background:var(--peach-soft);border-radius:var(--r-md);font-size:.875rem;
  line-height:1.6;color:var(--ink);overflow:hidden
}
.notice:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--peach)}
.notice strong{color:var(--peach);font-weight:700}
.notice.error{
  background:rgba(245,163,163,.14);border-color:rgba(245,163,163,.45)
}
.notice.error:before{background:var(--alert)}
.notice.error strong{color:var(--alert)}
.notice+.notice{margin-top:12px}
.notice .btn{margin-top:12px}
.globalnotice{margin-bottom:18px}
.empty{padding:14px 0;color:var(--ink-3);font-size:.9375rem}

/* --- 14. Календар ---------------------------------------- */
.calendarcard{padding:22px}
.calendarhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.calendarhead h2{font-size:1.1875rem;letter-spacing:-.01em}
.calendargrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.weekday{
  text-align:center;font-size:.6875rem;font-weight:700;letter-spacing:.08em;
  color:var(--ink-3);padding:2px 0 10px;text-transform:uppercase
}
.day{
  min-height:64px;border:1px solid transparent;background:rgba(4,18,26,.28);
  border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;padding:8px 2px;position:relative;
  font-size:.9375rem;font-weight:600;color:var(--ink-2);
  transition:background .14s ease,transform .14s ease
}
.day:hover{background:rgba(255,255,255,.13);color:var(--ink)}
.day.selected{
  background:#eef5fa;color:var(--peach-ink);font-weight:700;
  box-shadow:0 12px 28px -12px rgba(0,0,0,.9)
}
.day.today{box-shadow:inset 0 0 0 2px var(--peach);color:var(--peach)}
.day.today.selected{box-shadow:inset 0 0 0 2px var(--peach),0 12px 28px -12px rgba(0,0,0,.9);color:var(--peach-ink)}
.day.out{opacity:.3}
.daymarks{height:8px;display:flex;align-items:center;gap:4px;justify-content:center}
.daymark{width:6px;height:6px;border-radius:50%;flex:none}
.day.selected .daymark{box-shadow:0 0 0 1px rgba(15,42,53,.55)}
.daymark.taskmark{background:#dbe8f1;border-radius:1px}
.daymark.metricmark{background:#ffb877;transform:rotate(45deg);border-radius:1px}
.callegend{
  display:flex;flex-wrap:wrap;gap:10px 16px;font-size:.75rem;font-weight:600;
  color:var(--ink-3);padding-top:18px;margin-top:16px;border-top:1px solid var(--line)
}
.callegend span{display:flex;align-items:center;gap:6px}

/* --- 15. Таблици и редове -------------------------------- */
.metricrow{
  display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;
  border-bottom:1px solid var(--line);padding:14px 0;align-items:center
}
.metricrow:last-child{border:0;padding-bottom:0}
.metricrow:first-child{padding-top:0}
.metricrow b{font-weight:650}
.metriclist .metricrow{grid-template-columns:minmax(0,1fr) auto}
.tablewrap{
  overflow-x:auto;margin-top:16px;border:1px solid var(--line);
  border-radius:var(--r-md);-webkit-overflow-scrolling:touch
}
.tablewrap::-webkit-scrollbar{height:9px}
.tablewrap::-webkit-scrollbar-track{background:rgba(0,0,0,.22);border-radius:var(--r-pill)}
.tablewrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:var(--r-pill)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{
  color:var(--ink-3);font-weight:700;font-size:.6875rem;letter-spacing:.09em;
  text-transform:uppercase;background:rgba(0,0,0,.16);white-space:nowrap
}
td{min-width:100px}
td:first-child{min-width:175px;font-weight:600}
tbody tr:hover td{background:rgba(255,255,255,.04)}
.snapshot{padding:16px 0;border-bottom:1px solid var(--line)}
.snapshot:first-child{padding-top:0}
.snapshot:last-child{border:0;padding-bottom:0}
.snapshot .actions{margin-top:12px}
.auditrow{padding:18px 0;border-bottom:1px solid var(--line)}
.auditrow:first-child{padding-top:0}
.auditrow:last-child{border:0;padding-bottom:0}
.auditrow h3{margin-bottom:8px}
.auditrow p{margin:6px 0 0;color:var(--ink-2)}

/* --- 16. Формуляри --------------------------------------- */
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:end}
.field{display:grid;gap:7px;color:var(--ink-2);font-size:.8125rem;font-weight:600;min-width:0}
.field.wide{grid-column:1/-1}
.field input,.field select,.field textarea{
  width:100%;min-width:0;background:var(--inset);
  border:1px solid rgba(255,255,255,.18);color:var(--ink);
  padding:12px 14px;font-size:1rem;font-weight:400;min-height:48px;
  border-radius:var(--r-sm);color-scheme:dark;
  transition:border-color .16s ease,box-shadow .16s ease
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--peach);box-shadow:0 0 0 3px var(--peach-soft)
}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3)}
.field textarea{min-height:96px;resize:vertical;line-height:1.6}
.field option{background:#153541;color:#fff}
.field small{font-size:.75rem;font-weight:400;color:var(--ink-3)}
.formgrid+.actions{margin-top:20px}
.choice{display:flex;align-items:center;gap:11px;font-size:.9375rem;padding:4px 0}
.choice>span{display:flex;align-items:center;gap:12px}
.field .check,.choice .check{
  width:24px;height:24px;min-height:0;padding:0;flex:none;margin:0;
  border-radius:8px
}

/* --- 17. Текстови блокове -------------------------------- */
details{border-top:1px solid var(--line);padding:18px 0}
details:first-child{border-top:0;padding-top:0}
details:last-child{padding-bottom:0}
summary{
  cursor:pointer;font-weight:650;line-height:1.45;list-style-position:outside;
  margin-left:18px;padding-left:4px
}
summary::marker{color:var(--peach)}
summary:hover{color:var(--peach)}
details[open]>summary{margin-bottom:14px}
details p{margin-top:10px;color:var(--ink-2)}
.list{padding-left:22px;margin:12px 0 0;color:var(--ink-2)}
.list li{padding:5px 0}
.list li::marker{color:var(--peach)}
.guideblock+.guideblock{margin-top:24px}
.guideblock h3{margin-bottom:8px}
.smallheading{margin:26px 0 12px}
.trend{border-bottom:1px solid var(--line);padding:18px 0}
.trend:first-child{padding-top:0}
.trend:last-child{border:0;padding-bottom:0}
.trend h3{margin:8px 0}
.source{padding:16px 0;border-bottom:1px solid var(--line)}
.source:first-child{padding-top:0}
.source:last-child{border:0;padding-bottom:0}
.source p{margin-top:6px;color:var(--ink-2)}
.copytext{white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}

/* --- 18. Диалог ------------------------------------------ */
dialog{
  color:var(--ink);border:1px solid var(--line-strong);border-radius:28px;
  background:linear-gradient(165deg,#2a5265 0%,#183a4a 45%,#0f2833 100%);
  box-shadow:0 40px 120px rgba(3,14,20,.75);
  width:min(840px,calc(100vw - 48px));max-height:calc(100dvh - 60px);
  padding:0;overflow:auto;overscroll-behavior:contain
}
dialog::backdrop{background:rgba(5,18,26,.7);backdrop-filter:blur(8px)}
.dialoghead{
  padding:22px 26px 18px;border-bottom:1px solid var(--line);
  background:rgba(21,50,64,.92);position:sticky;top:0;z-index:5;
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%)
}
.dialogtitle{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dialogtitle h2{margin:8px 0 6px;font-size:1.5rem;letter-spacing:-.025em}
.dialogtabs{
  display:flex;gap:4px;background:rgba(0,0,0,.28);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:4px;margin-top:18px
}
.dialogtabs button{
  flex:1;padding:9px 8px;border:0;background:none;border-radius:var(--r-pill);
  font-size:.875rem;font-weight:600;color:var(--ink-2);min-height:40px;
  transition:background .16s ease,color .16s ease
}
.dialogtabs button:hover{color:var(--ink)}
.dialogtabs button.active{background:#eaf3f9;color:var(--peach-ink);font-weight:700}
.dialogbody{padding:26px 26px 34px}
.dialogbody .card{
  background:rgba(255,255,255,.07);border-color:var(--line);padding:20px;
  box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none
}
.hookbox{
  border-left:3px solid var(--peach);
  background:linear-gradient(115deg,rgba(247,201,167,.28),rgba(247,201,167,.07));
  border-radius:0 var(--r-md) var(--r-md) 0;padding:16px 18px;margin:18px 0 24px
}
.hookbox p{font-size:1.1875rem;line-height:1.45;margin-top:8px;font-weight:550}
.hookbox .eyebrow{color:var(--peach)}
.beat{
  display:grid;grid-template-columns:58px minmax(0,1fr);gap:16px;
  padding:20px 0;border-bottom:1px solid var(--line)
}
.beat:first-child{padding-top:0}
.beat:last-child{border:0;padding-bottom:0}
.beattime{font-size:.8125rem;font-weight:700;color:var(--peach);line-height:1.35}
.beatbody{font-size:1rem}
.beatbody p{margin-bottom:9px}
.beatbody small{display:block;color:var(--ink-2);font-size:.875rem}
.screenline{
  border:1px solid var(--line);background:rgba(0,0,0,.2);padding:9px 12px;
  border-radius:var(--r-sm);margin-top:10px;font-size:.875rem;color:var(--ink-2)
}
.slidetext{font-size:1.125rem;margin:10px 0 14px;white-space:pre-line;line-height:1.5}
.slidecount{font-size:.6875rem;font-weight:700;letter-spacing:.16em;color:var(--peach)}
.savebar{
  position:sticky;bottom:0;padding:18px 0 0;display:flex;justify-content:flex-end;
  background:linear-gradient(transparent,#112b36 34%)
}

/* --- 19. Toast ------------------------------------------- */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%);max-width:min(90vw,600px);z-index:30;
  padding:13px 22px;border-radius:var(--r-pill);background:#eef5fa;
  color:var(--peach-ink);font-weight:600;
  box-shadow:0 18px 50px rgba(3,14,20,.6);font-size:.9375rem;text-align:center
}
.toast[hidden]{display:none}
.mobileonly{display:none}

/* --- 20. Адаптивност ------------------------------------- */
@media(min-width:1100px){
  .calcolumns{grid-template-columns:minmax(0,1.06fr) minmax(0,1fr)}
  .calsticky{position:sticky;top:26px}
}
@media(max-width:1099px){
  .layout{grid-template-columns:168px minmax(0,1fr);gap:26px}
  .shell{padding-left:24px;padding-right:24px}
  .twocol{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .nav button{padding:12px 12px;gap:10px}
  .calcolumns{grid-template-columns:1fr}
}
@media(max-width:760px){
  :root{--pad:20px;--gap:14px;--r-lg:22px}
  .shell{padding:calc(18px + env(safe-area-inset-top)) 16px calc(118px + env(safe-area-inset-bottom))}
  .topbar{padding-bottom:22px}
  .brand strong{font-size:.875rem;letter-spacing:.18em}
  .brandmark{width:34px;height:34px;font-size:17px}
  .avatar{width:36px;height:36px}
  .layout{display:block}
  .nav{
    position:fixed;top:auto;bottom:0;left:0;right:0;
    padding:8px 10px calc(6px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;
    background:rgba(7,22,30,.97);
    backdrop-filter:blur(30px) saturate(160%);
    -webkit-backdrop-filter:blur(30px) saturate(160%);
    border-top:1px solid var(--line-strong);z-index:10;
    border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(3,14,20,.5)
  }
  .nav button{
    font-size:.6875rem;font-weight:650;flex-direction:column;gap:4px;
    padding:8px 0 6px;min-height:58px;border-radius:var(--r-md);
    text-align:center;line-height:1.2;letter-spacing:.01em
  }
  .nav button.active{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
  .nav button.active:before{display:none}
  .navfooter{display:none}
  .pagehead{margin-bottom:20px}
  .pagehead p{font-size:.9375rem}
  .sectiontitle{margin-top:26px}
  .stats .card{padding:18px}
  .featured h2{font-size:1.75rem}
  .featured .hookquote{font-size:1rem}
  .pagehead .datebadge{padding:8px 12px}
  .topmeta .muted{font-size:.75rem}
  .day{min-height:56px;border-radius:13px;gap:5px}
  .calendargrid{gap:5px}
  .calendarcard{padding:16px 12px}
  .calendarhead{padding:0 4px}
  .formgrid{gap:14px 10px}
  .toast{bottom:calc(106px + env(safe-area-inset-bottom));width:max-content;max-width:90vw}
  .desktoponly{display:none}
  .mobileonly{display:block}
  .metricrow{gap:10px}
  .rating{grid-template-columns:1fr 1fr;gap:10px}
  .rating>div:last-child{grid-column:1/-1}
  .rating>div{padding:14px}
  .rating b{font-size:1.45rem}
  dialog{
    width:100%;max-width:none;max-height:none;height:100dvh;
    border:0;border-radius:0;margin:0;inset:0
  }
  .dialoghead{padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
  .dialogtitle h2{font-size:1.35rem}
  .dialogbody{padding:22px 18px calc(38px + env(safe-area-inset-bottom))}
  .dialogtabs{margin-top:14px}
  .beat{grid-template-columns:56px minmax(0,1fr);gap:12px}
  .hookbox p{font-size:1.0625rem}
  .dialogbody .card{padding:18px}
  .savebar{padding-bottom:env(safe-area-inset-bottom)}
  .btn{padding:11px 16px}
  .postmain{padding-left:20px;padding-right:20px}
  .postfooter{padding-left:20px;padding-right:20px}
}
@media(max-width:355px){
  .shell{padding-left:12px;padding-right:12px}
  .topmeta .muted{display:none}
  :root{--pad:16px}
  .day{min-height:50px}
  .calendarcard{padding:14px 9px}
  .formgrid{grid-template-columns:1fr}
  .field.wide{grid-column:auto}
  .stats{gap:9px}
  .stats .card{padding:14px}
  .statnum{font-size:1.9rem}
  .rating{grid-template-columns:1fr}
  .rating>div:last-child{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* --- 21. Печат ------------------------------------------- */
@media print{
  body{background:#fff;color:#12262f}
  body:before,body:after,.nav,.topbar,.noprint,.toast,.btn{display:none!important}
  .shell{padding:0}
  .layout{display:block}
  .card{
    background:#fff;border:1px solid #ccd7df;box-shadow:none;color:#12262f;
    break-inside:avoid;backdrop-filter:none
  }
  .muted,.eyebrow,.tasktime,th{color:#41586a}
  .notice{background:#fff8f2;border-color:#e0c3ac;color:#12262f}
  dialog{position:static;max-height:none;overflow:visible;background:#fff;color:#12262f;border:0}
  .dialoghead{position:static;background:#fff}
  .dialogbody{padding:14px}
  .twocol{display:block}
}
